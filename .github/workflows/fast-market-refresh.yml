name: Fast Market Refresh V230

on:
  workflow_dispatch:
  schedule:
    - cron: "31 */2 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fed-fast-market-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Refresh nearest policy futures only
        run: python fast_market_refresh.py
      - name: Commit only changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/fast_market_refresh_status.json
          if git diff --cached --quiet; then
            echo "No changes; skip push."
          else
            git commit -m "chore: fast refresh policy futures snapshot"
            git push
          fi
