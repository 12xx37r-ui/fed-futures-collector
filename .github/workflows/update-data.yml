name: Update Fed Policy Engine Full

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *"

permissions:
  contents: write

concurrency:
  group: fed-policy-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, calculate, snapshot, evaluate
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "RUNNING FED ENGINE V4.0.0 PROBABILITY VALIDATION SPLIT"
          python run.py

      - name: Verify generated latest.json is V4.0.0
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          p = Path("public/data/latest.json")
          if not p.exists():
              raise SystemExit("public/data/latest.json was not generated")
          data = json.loads(p.read_text(encoding="utf-8"))
          version = str(data.get("engine_version") or "")
          if not version.startswith("4.0.0"):
              raise SystemExit(f"Unexpected engine_version in latest.json: {version!r}")
          confidence = data.get("confidence") or {}
          required = ("data_quality_score", "model_validation_score", "forecast_validation")
          missing = [k for k in required if k not in confidence]
          if missing:
              raise SystemExit(f"Missing confidence fields: {missing}")
          ctx = data.get("us_macro_context") or {}
          m2 = ctx.get("m2") or {}
          dxy = ctx.get("dxy") or {}
          if not m2.get("available"):
              raise SystemExit("US M2 context unavailable in latest.json")
          if not dxy.get("available"):
              raise SystemExit("DXY context unavailable in latest.json")
          dedicated = Path("public/data/us_liquidity_dxy.json")
          if not dedicated.exists():
              raise SystemExit("public/data/us_liquidity_dxy.json was not generated")
          print("latest.json verified:", version, "US M2/DXY context OK")
          PY2

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build V218 refetch freshness status
        run: python freshness_audit_v218.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Update full policy engine data"
            git push
          fi
